group 'ml.medyas.flutter_qiblah'
version '1.0-SNAPSHOT'

// Patched for Gradle 9 / AGP 9: the original file declared `jcenter()` (removed
// in Gradle 9), an old AGP 7.3 classpath and the kotlin-android plugin. A host
// app supplies AGP and Kotlin, so this plugin only needs to apply the Android
// library plugin. See ../PATCHES.md.
apply plugin: 'com.android.library'
// The plugin is written in Kotlin; the Kotlin Gradle plugin version comes from the
// host app (android/settings.gradle.kts), so no buildscript classpath is needed.
apply plugin: 'kotlin-android'

android {
    namespace "ml.medyas.flutter_qiblah"
    compileSdk 36

    defaultConfig {
        minSdk 21
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
